<!doctype html>
<html lang="en" class="theme-dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Threadleaf compatibility renderer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      :root {
        color-scheme: dark;
        --background-primary: #1f2329;
        --background-primary-alt: #252a31;
        --background-secondary: #191d22;
        --background-secondary-alt: #15191e;
        --background-modifier-border: #3a414b;
        --background-modifier-form-field: #252a31;
        --background-modifier-hover: #303741;
        --background-modifier-active-hover: #39424e;
        --background-modifier-error: #b45309;
        --background-modifier-error-hover: #c46612;
        --text-normal: #e6e8eb;
        --text-muted: #aab0ba;
        --text-faint: #7f8793;
        --text-on-accent: #101820;
        --text-error: #f0a35b;
        --interactive-normal: #292f37;
        --interactive-hover: #343c47;
        --interactive-accent: #a98bfa;
        --interactive-accent-hover: #b89fff;
        --scrollbar-bg: transparent;
        --scrollbar-thumb-bg: #4a5360;
        --font-interface-theme: Inter, system-ui, sans-serif;
        --font-text-theme: Inter, system-ui, sans-serif;
        --font-monospace-theme: "JetBrains Mono", ui-monospace, monospace;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background-primary: #f7f5ef;
        --background-primary-alt: #fffef9;
        --background-secondary: #e8e6df;
        --background-secondary-alt: #eeece5;
        --background-modifier-border: #d5d2c8;
        --background-modifier-form-field: #fffef9;
        --background-modifier-hover: #eeece5;
        --background-modifier-active-hover: #e2dfd6;
        --background-modifier-error: #fae6d2;
        --background-modifier-error-hover: #f3d2b2;
        --text-normal: #17212c;
        --text-muted: #46515e;
        --text-faint: #6c7580;
        --text-on-accent: #ffffff;
        --text-error: #a54b00;
        --interactive-normal: #fffef9;
        --interactive-hover: #eeece5;
        --interactive-accent: #1769aa;
        --interactive-accent-hover: #0e4f86;
        --scrollbar-thumb-bg: #b8b4a9;
      }

      body {
        color: var(--text-normal);
        background: var(--background-primary);
        font-family: var(--font-interface-theme);
      }

      .threadleaf-plugin-surface,
      .threadleaf-plugin-surface > .view-content {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        min-height: 0;
      }

      .threadleaf-plugin-surface {
        display: flex;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
      }

      .threadleaf-plugin-surface > .view-header {
        display: flex;
        min-height: 38px;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 14px;
        border-bottom: 1px solid var(--background-modifier-border);
        background: var(--background-primary-alt);
      }

      .view-header-title-container {
        min-width: 0;
        flex: 1;
      }

      .view-header-title {
        overflow: hidden;
        color: var(--text-muted);
        font-size: 13px;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .view-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .view-action {
        display: inline-grid;
        min-width: 28px;
        min-height: 28px;
        place-items: center;
        border: 0;
        border-radius: 6px;
        color: var(--text-muted);
        background: transparent;
      }

      .view-action:hover {
        color: var(--text-normal);
        background: var(--background-modifier-hover);
      }

      .svg-icon {
        display: block;
        width: 18px;
        height: 18px;
        pointer-events: none;
      }

      .modal-container {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      .modal-bg {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 58%);
      }

      .modal {
        position: relative;
        display: flex;
        width: min(680px, 100%);
        max-height: min(80vh, 760px);
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--background-modifier-border);
        border-radius: 12px;
        background: var(--background-primary);
        box-shadow: 0 22px 70px rgb(0 0 0 / 38%);
      }

      .modal-header {
        padding: 20px 24px 0;
      }

      .modal-title {
        color: var(--text-normal);
        font-size: 20px;
        font-weight: 650;
      }

      .modal-content {
        min-height: 0;
        padding: 18px 24px 24px;
        overflow: auto;
        color: var(--text-normal);
        line-height: 1.5;
      }

      .modal-content a {
        color: var(--interactive-accent);
      }

      .modal-content button {
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 7px;
        color: var(--text-normal);
        background: var(--interactive-normal);
      }

      .modal-content button:hover {
        background: var(--interactive-hover);
      }

      .threadleaf-plugin-surface > .view-content {
        height: auto;
        flex: 1;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="threadleaf-plugin-host theme-dark">
    <script src="../main/plugin-renderer.cjs"></script>
  </body>
</html>
