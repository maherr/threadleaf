<!doctype html>
<html lang="en" class="theme-dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Threadleaf compatibility renderer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      :root {
        color-scheme: dark;
        --background-primary: #1f2329;
        --background-primary-alt: #252a31;
        --background-secondary: #191d22;
        --background-secondary-alt: #15191e;
        --background-modifier-border: #3a414b;
        --background-modifier-form-field: #252a31;
        --background-modifier-hover: #303741;
        --background-modifier-active-hover: #39424e;
        --background-modifier-error: #b45309;
        --background-modifier-error-hover: #c46612;
        --text-normal: #e6e8eb;
        --text-muted: #aab0ba;
        --text-faint: #7f8793;
        --text-on-accent: #101820;
        --text-error: #f0a35b;
        --interactive-normal: #292f37;
        --interactive-hover: #343c47;
        --interactive-accent: #a98bfa;
        --interactive-accent-hover: #b89fff;
        --scrollbar-bg: transparent;
        --scrollbar-thumb-bg: #4a5360;
        --font-interface-theme: Inter, system-ui, sans-serif;
        --font-text-theme: Inter, system-ui, sans-serif;
        --font-monospace-theme: "JetBrains Mono", ui-monospace, monospace;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background-primary: #f7f5ef;
        --background-primary-alt: #fffef9;
        --background-secondary: #e8e6df;
        --background-secondary-alt: #eeece5;
        --background-modifier-border: #d5d2c8;
        --background-modifier-form-field: #fffef9;
        --background-modifier-hover: #eeece5;
        --background-modifier-active-hover: #e2dfd6;
        --background-modifier-error: #fae6d2;
        --background-modifier-error-hover: #f3d2b2;
        --text-normal: #17212c;
        --text-muted: #46515e;
        --text-faint: #6c7580;
        --text-on-accent: #ffffff;
        --text-error: #a54b00;
        --interactive-normal: #fffef9;
        --interactive-hover: #eeece5;
        --interactive-accent: #1769aa;
        --interactive-accent-hover: #0e4f86;
        --scrollbar-thumb-bg: #b8b4a9;
      }

      body {
        color: var(--text-normal);
        background: var(--background-primary);
        font-family: var(--font-interface-theme);
      }

      .threadleaf-plugin-surface,
      .threadleaf-plugin-surface > .view-content {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        min-height: 0;
      }

      .threadleaf-plugin-surface {
        display: flex;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
      }

      .threadleaf-plugin-surface > .view-header {
        display: flex;
        min-height: 38px;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 14px;
        border-bottom: 1px solid var(--background-modifier-border);
        background: var(--background-primary-alt);
      }

      .view-header-title-container {
        min-width: 0;
        flex: 1;
      }

      .view-header-title {
        overflow: hidden;
        color: var(--text-muted);
        font-size: 13px;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .view-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .view-action {
        display: inline-grid;
        min-width: 28px;
        min-height: 28px;
        place-items: center;
        border: 0;
        border-radius: 6px;
        color: var(--text-muted);
        background: transparent;
      }

      .view-action:hover {
        color: var(--text-normal);
        background: var(--background-modifier-hover);
      }

      .threadleaf-compat-menu {
        position: fixed;
        z-index: 1600;
        display: grid;
        min-width: 190px;
        max-width: min(340px, calc(100vw - 8px));
        padding: 5px;
        overflow: hidden;
        border: 1px solid var(--background-modifier-border);
        border-radius: 9px;
        color: var(--text-normal);
        background: var(--background-primary-alt);
        box-shadow: 0 14px 38px rgb(0 0 0 / 34%);
      }

      .threadleaf-compat-menu .menu-item {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        min-height: 30px;
        padding: 4px 8px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: transparent;
        font: 12px var(--font-interface-theme);
        text-align: left;
      }

      .threadleaf-compat-menu .menu-item:hover:not(:disabled),
      .threadleaf-compat-menu .menu-item:focus-visible {
        outline: 0;
        color: var(--text-normal);
        background: var(--background-modifier-hover);
      }

      .threadleaf-compat-menu .menu-item:focus-visible {
        box-shadow: inset 0 0 0 2px var(--interactive-accent);
      }

      .threadleaf-compat-menu .menu-item:disabled {
        color: var(--text-faint);
        cursor: default;
      }

      .threadleaf-compat-menu .menu-item.is-label {
        min-height: 24px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .threadleaf-compat-menu .menu-item.is-warning {
        border-left: 2px dashed var(--text-error);
        color: var(--text-error);
      }

      .threadleaf-compat-menu .menu-item-icon {
        display: grid;
        width: 18px;
        height: 18px;
        place-items: center;
      }

      .threadleaf-compat-menu.menu-no-icon .menu-item {
        grid-template-columns: minmax(0, 1fr);
      }

      .threadleaf-compat-menu.menu-no-icon .menu-item-icon {
        display: none;
      }

      .threadleaf-compat-menu .menu-item-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .threadleaf-compat-menu .menu-separator {
        height: 1px;
        margin: 4px 6px;
        background: var(--background-modifier-border);
      }

      .svg-icon {
        display: block;
        width: 18px;
        height: 18px;
        pointer-events: none;
      }

      .modal-container {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      .modal-bg {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 58%);
      }

      .modal {
        position: relative;
        display: flex;
        width: min(680px, 100%);
        max-height: min(80vh, 760px);
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--background-modifier-border);
        border-radius: 12px;
        background: var(--background-primary);
        box-shadow: 0 22px 70px rgb(0 0 0 / 38%);
      }

      .modal-header {
        padding: 20px 24px 0;
      }

      .modal-title {
        color: var(--text-normal);
        font-size: 20px;
        font-weight: 650;
      }

      .modal-content {
        min-height: 0;
        padding: 18px 24px 24px;
        overflow: auto;
        color: var(--text-normal);
        line-height: 1.5;
      }

      .modal-content a {
        color: var(--interactive-accent);
      }

      .modal-content button {
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 7px;
        color: var(--text-normal);
        background: var(--interactive-normal);
      }

      .modal-content button:hover {
        background: var(--interactive-hover);
      }

      .threadleaf-plugin-surface > .view-content {
        height: auto;
        flex: 1;
        overflow: hidden;
      }

      .threadleaf-plugin-settings-surface {
        overflow: auto;
      }

      .threadleaf-plugin-settings-surface > .vertical-tab-content {
        box-sizing: border-box;
        width: min(820px, 100%);
        margin: 0 auto;
        padding: 34px 42px 64px;
        color: var(--text-normal);
      }

      .vertical-tab-content h1,
      .vertical-tab-content h2,
      .vertical-tab-content h3 {
        margin: 0 0 18px;
        color: var(--text-normal);
        line-height: 1.25;
      }

      .vertical-tab-content h1 {
        font-size: 24px;
      }

      .vertical-tab-content h2 {
        font-size: 20px;
      }

      .vertical-tab-content h3 {
        margin-top: 24px;
        font-size: 16px;
      }

      .vertical-tab-content a {
        color: var(--interactive-accent);
      }

      .setting-item {
        display: flex;
        min-height: 46px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 13px 0;
        border-top: 1px solid var(--background-modifier-border);
      }

      .setting-item[hidden] {
        display: none;
      }

      .setting-item-info {
        min-width: 0;
        flex: 1;
      }

      .setting-item-name {
        color: var(--text-normal);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }

      .setting-item-description {
        margin-top: 3px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .setting-item-control {
        display: flex;
        max-width: 56%;
        flex: 0 0 auto;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .setting-item-heading {
        min-height: 0;
        align-items: end;
        padding-top: 28px;
        border-top: 0;
      }

      .setting-item-heading .setting-item-name {
        font-size: 17px;
      }

      .setting-item.is-disabled {
        opacity: 0.58;
      }

      .setting-item-control button,
      .vertical-tab-content > button {
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 7px;
        color: var(--text-normal);
        background: var(--interactive-normal);
        font: 600 12px var(--font-interface-theme);
      }

      .setting-item-control button:hover,
      .vertical-tab-content > button:hover {
        background: var(--interactive-hover);
      }

      .setting-item-control button.mod-cta {
        border-color: var(--interactive-accent);
        color: var(--text-on-accent);
        background: var(--interactive-accent);
      }

      .setting-item-control button.mod-warning {
        border-color: var(--background-modifier-error);
        color: var(--text-error);
      }

      .setting-item-control input:not([type="checkbox"]):not([type="range"]):not([type="color"]),
      .setting-item-control textarea,
      .setting-item-control select {
        box-sizing: border-box;
        min-height: 32px;
        max-width: 100%;
        padding: 5px 9px;
        border: 1px solid var(--background-modifier-border);
        border-radius: 6px;
        outline: 0;
        color: var(--text-normal);
        background: var(--background-modifier-form-field);
        font: 12px var(--font-interface-theme);
      }

      .setting-item-control textarea {
        min-height: 76px;
        resize: vertical;
      }

      .setting-item-control input:focus-visible,
      .setting-item-control textarea:focus-visible,
      .setting-item-control select:focus-visible,
      .setting-item-control button:focus-visible {
        outline: 2px solid var(--interactive-accent);
        outline-offset: 2px;
      }

      .setting-item-control .checkbox-container {
        width: 18px;
        height: 18px;
        accent-color: var(--interactive-accent);
      }

      .setting-item-control .slider {
        width: min(220px, 30vw);
        accent-color: var(--interactive-accent);
      }

      @media (max-width: 680px) {
        .threadleaf-plugin-settings-surface > .vertical-tab-content {
          padding: 24px 20px 48px;
        }

        .setting-item {
          align-items: stretch;
          flex-direction: column;
          gap: 10px;
        }

        .setting-item-control {
          width: 100%;
          max-width: none;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body class="threadleaf-plugin-host theme-dark">
    <script src="../main/plugin-renderer.cjs"></script>
  </body>
</html>
