name: Bug report
description: Report a reproducible Threadleaf failure against a synthetic or shareable vault.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private note text, real vault paths, credentials, or personal data. Security issues belong in private vulnerability reporting, not here.
  - type: input
    id: version
    attributes:
      label: Threadleaf version
      description: Copy the exact version from Settings, About and updates.
      placeholder: 0.1.0-beta.8
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and package
      placeholder: Fedora 44, AppImage
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: Give the smallest ordered steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Attach the support bundle from Settings if it is relevant. Review it before uploading.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private note text, real vault paths, credentials, and personal data.
          required: true
