name: Native package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Installer lifecycle integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate lifecycle workflow and package contract
        run: pnpm run test:installer-lifecycle-config

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install native package tools
        run: sudo apt-get update && sudo apt-get install -y fish libfuse2t64 rpm xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install packaged Chromium sandbox helper
        run: |
          pnpm run pack:dir
          sudo install -o root -g root -m 4755 release/linux-unpacked/chrome-sandbox /usr/local/sbin/threadleaf-chrome-sandbox
      - name: Build and verify Linux packages
        env:
          CHROME_DEVEL_SANDBOX: /usr/local/sbin/threadleaf-chrome-sandbox
        run: pnpm run release:linux
      - name: Verify reviewed plugin package E2E
        run: pnpm run test:plugin-packages-e2e:built
      - name: Check community theme integrity
        run: pnpm run community-theme:integrity
      - name: Run committed visual regression matrix
        env:
          THREADLEAF_VISUAL_REQUIRED: "1"
        run: pnpm run visual:check
      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-linux-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source on macOS
        env:
          THREADLEAF_CONTRIBUTOR_PLATFORM_TESTS: "1"
        run: pnpm check
      - name: Check community theme integrity
        run: pnpm run community-theme:integrity
      - name: Check visual matrix integrity
        run: pnpm run visual:integrity
      - name: Build unsigned native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run "pack:mac:${{ matrix.arch }}"
      - name: Verify native package
        env:
          THREADLEAF_PACKAGE_ARCH: ${{ matrix.arch }}
        run: pnpm run test:macos-package
      - name: Upload macOS package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-macos-${{ matrix.arch }}
          path: |
            release/Threadleaf-*-mac-${{ matrix.arch }}.*
            release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Verify Intel macOS installer lifecycle
        if: matrix.arch == 'x64'
        env:
          THREADLEAF_PACKAGE_ARCH: x64
          THREADLEAF_LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts/macos-x64
        run: pnpm run test:installer-lifecycle
      - name: Upload Intel macOS lifecycle evidence
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-macos-x64-lifecycle-evidence
          path: lifecycle-artifacts/macos-x64/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Configure Visual C++ toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source on Windows
        env:
          THREADLEAF_CONTRIBUTOR_PLATFORM_TESTS: "1"
        run: pnpm check
      - name: Check community theme integrity
        run: pnpm run community-theme:integrity
      - name: Check visual matrix integrity
        run: pnpm run visual:integrity
      - name: Build unsigned native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run pack:windows
      - name: Verify ZIP, installer, uninstall, and update metadata
        run: pnpm run test:windows-package
      - name: Verify Windows installer lifecycle
        env:
          THREADLEAF_PACKAGE_ARCH: x64
          THREADLEAF_LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts/windows-x64
        run: pnpm run test:installer-lifecycle
      - name: Upload Windows package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-windows-x64
          path: |
            release/Threadleaf-*-win-x64.*
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Windows lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-windows-x64-lifecycle-evidence
          path: lifecycle-artifacts/windows-x64/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
