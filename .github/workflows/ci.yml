name: Native package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install native package tools
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64 rpm xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Linux packages
        run: pnpm run release:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-linux-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source on macOS
        run: pnpm check
      - name: Build unsigned native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run "pack:mac:${{ matrix.arch }}"
      - name: Verify native package
        env:
          THREADLEAF_PACKAGE_ARCH: ${{ matrix.arch }}
        run: pnpm run test:macos-package
      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-macos-${{ matrix.arch }}
          path: |
            release/Threadleaf-*-mac-${{ matrix.arch }}.*
            release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source on Windows
        run: pnpm check
      - name: Build unsigned native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run pack:windows
      - name: Verify ZIP, installer, uninstall, and update metadata
        run: pnpm run test:windows-package
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threadleaf-windows-x64
          path: |
            release/Threadleaf-*-win-x64.*
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
