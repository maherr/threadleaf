name: Signed release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build
        required: true
        type: string
      publish:
        description: Create or update a draft GitHub release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Match tag to package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux release candidate
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install native package tools
        run: sudo apt-get update && sudo apt-get install -y fish libfuse2t64 rpm xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build source and unpacked Linux app
        run: pnpm run release:linux:prepare
      - name: Prepare packaged Chromium sandbox helper
        run: |
          sudo install -o root -g root -m 4755 release/linux-unpacked/chrome-sandbox /usr/local/sbin/threadleaf-chrome-sandbox
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%u:%g:%a' release/linux-unpacked/chrome-sandbox)" = "0:0:4755"
      - name: Verify and package Linux app
        env:
          CHROME_DEVEL_SANDBOX: /usr/local/sbin/threadleaf-chrome-sandbox
        run: pnpm run release:linux:verify
      - name: Verify reviewed plugin package E2E
        env:
          CHROME_DEVEL_SANDBOX: /usr/local/sbin/threadleaf-chrome-sandbox
        run: pnpm run test:plugin-packages-e2e:built
      - name: Check community theme integrity
        run: pnpm run community-theme:integrity
      - name: Upload Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    name: Signed and notarized universal macOS candidate
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Check source on macOS
        run: pnpm check
      - name: Check community theme integrity
        run: pnpm run community-theme:integrity
      - name: Build signed and notarized universal package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: pnpm run pack:mac:universal
      - name: Verify signing, notarization, package bytes, and update metadata
        env:
          THREADLEAF_PACKAGE_ARCH: universal
          THREADLEAF_REQUIRE_SIGNED: "1"
        run: pnpm run test:macos-package
      - name: Upload macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: |
            release/Threadleaf-*-mac-universal.*
            release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows:
    name: Signed Windows x64 candidate
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Configure Visual C++ toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) { throw "WINDOWS_CSC_LINK is required." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_KEY_PASSWORD)) { throw "WINDOWS_CSC_KEY_PASSWORD is required." }
      - name: Check source on Windows
        run: pnpm check
      - name: Check community theme integrity
        run: pnpm run community-theme:integrity
      - name: Build signed Windows package
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: pnpm run pack:windows:signed
      - name: Verify signatures, installer lifecycle, package bytes, and update metadata
        env:
          THREADLEAF_REQUIRE_SIGNED: "1"
        run: pnpm run test:windows-package
      - name: Upload Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: |
            release/Threadleaf-*-win-x64.*
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-draft:
    name: Attest and create draft release
    if: ${{ inputs.publish }}
    needs:
      - preflight
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
      - name: Attest release subjects
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/**/*
      - name: Create draft release and upload every candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "Threadleaf $RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_TAG" --clobber artifacts/release-linux-x64/* artifacts/release-macos-universal/* artifacts/release-windows-x64/*
